# Production-shaped compose for Trim API (single region).
# Use managed Postgres (Supabase) + managed Redis (Upstash) in real prod when possible.
# This file is for self-host / staging HA-shaped local ops, not multi-region by itself.
#
# Usage:
#   cp server/.env.example server/.env.prod   # fill real secrets
#   docker compose -f docker-compose.prod.yml --env-file server/.env.prod up -d --build
#
# Tree-sitter in the API image stays off by default (ENABLE_TREESITTER=0).

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        ENABLE_TREESITTER: ${ENABLE_TREESITTER:-0}
    image: trim-api:${TRIM_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${TRIM_API_PORT:-8080}:8080"
    env_file:
      - ${TRIM_ENV_FILE:-./server/.env}
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud}
      # Prefer external DATABASE_URL / REDIS_URL from env_file (Supabase + Upstash).
      # Fallback local sidecar services below only when those URLs are unset.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/trim_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "/api", "-readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Optional local Postgres when not using Supabase. Omit by setting COMPOSE_PROFILES without "local-data".
  postgres:
    profiles: ["local-data"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: trim_db
    volumes:
      - trim_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["local-data"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trim_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trim_pgdata_prod:
  trim_redisdata_prod:
