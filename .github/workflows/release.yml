      - name: Upload windows Tree-sitter+Zig zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            "cli/dist/trim_windows_amd64_treesitter_zig.zip" \
            --clobber

  # Apple notarization (ops). Soft-skips when APPLE_DEVELOPER_ID_APPLICATION is unset.
  # Requires paid Apple Developer Program + identity on the runner keychain.
  sign-darwin:
    needs: [goreleaser, treesitter-darwin]
    runs-on: macos-14
    env:
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Gate on Apple signing secrets
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${APPLE_DEVELOPER_ID_APPLICATION:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing skipped (set APPLE_DEVELOPER_ID_APPLICATION + APPLE_ID + APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download darwin archives from release
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p signed
          gh release download "${GITHUB_REF_NAME}" -D signed -p 'trim_darwin_*'

      - name: codesign + notarytool
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in signed/trim_darwin_*.tar.gz; do
            base="$(basename "$archive" .tar.gz)"
            tmp="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmp"
            bin="$tmp/$base/trim"
            if [ ! -f "$bin" ]; then
              echo "missing binary in $archive"
              exit 1
            fi
            codesign --force --options runtime --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$bin"
            ditto -c -k --keepParent "$tmp/$base" "${base}.zip"
            xcrun notarytool submit "${base}.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple "$tmp/$base/trim" || true
            (cd "$tmp" && tar -czf "${base}.tar.gz" "$base")
            gh release upload "${GITHUB_REF_NAME}" "$tmp/${base}.tar.gz" --clobber
            rm -rf "$tmp"
          done

  # Windows EV signing (ops). Soft-skips when WINDOWS_CERT_PFX_BASE64 is unset.
  sign-windows:
    needs: [goreleaser, treesitter-windows]
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Gate on Windows signing secrets
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_PFX_BASE64:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Windows EV signing skipped (set WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download windows archives from release
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          gh release download "${GITHUB_REF_NAME}" -D signed -p 'trim_windows_*'

      - name: signtool EV sign
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 -d > cert.pfx
          shopt -s nullglob
          for zipf in signed/trim_windows_*.zip; do
            base="$(basename "$zipf" .zip)"
            tmp="$(mktemp -d)"
            unzip -q "$zipf" -d "$tmp"
            exe="$tmp/$base/trim.exe"
            if [ ! -f "$exe" ]; then
              echo "missing binary in $zipf"
              exit 1
            fi
            SIGNTOOL="$(ls /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/*/x64/signtool.exe 2>/dev/null | head -n1 || true)"
            if [ -z "$SIGNTOOL" ]; then
              echo "signtool.exe not found on runner; install Windows SDK or skip."
              exit 1
            fi
            "$SIGNTOOL" sign /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$exe"
            (cd "$tmp" && zip -r "${base}.zip" "$base")
            gh release upload "${GITHUB_REF_NAME}" "$tmp/${base}.zip" --clobber
            rm -rf "$tmp"
          done
          rm -f cert.pfx

  # Optional on tag: freeze + attach trim-deep (PyInstaller).
  # GitHub rejects continue-on-error on reusable workflow jobs, so deep is opt-in:
  # set repository variable TRIM_ATTACH_DEEP_ON_RELEASE=true to enable.
  # TRIM_SKIP_DEEP_ON_RELEASE=true always skips.
  deep-attach:
    needs: goreleaser
    if: vars.TRIM_ATTACH_DEEP_ON_RELEASE == 'true' && vars.TRIM_SKIP_DEEP_ON_RELEASE != 'true'
    uses: ./.github/workflows/build-trim-deep.yml
    with:
      upload_to_release: ${{ github.ref_name }}
      platforms: linux,darwin,windows
    secrets: inherit

  deep-attach-note:
    needs: [goreleaser, deep-attach]
    if: always() && needs.goreleaser.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Document Deep Mode release path and asset status
        run: |
          set -euo pipefail
          echo "Frozen trim-deep is not inside default GoReleaser archives (PyInstaller+torch)."
          if [ "${{ vars.TRIM_ATTACH_DEEP_ON_RELEASE }}" = "true" ] && [ "${{ vars.TRIM_SKIP_DEEP_ON_RELEASE }}" != "true" ]; then
            echo "TRIM_ATTACH_DEEP_ON_RELEASE=true: deep-attach ran for ${GITHUB_REF_NAME}."
          else
            echo "deep-attach skipped (opt-in). Enable: repo variable TRIM_ATTACH_DEEP_ON_RELEASE=true"
            echo "Manual: Actions → Build trim-deep → upload_to_release=${GITHUB_REF_NAME}"
          fi
          echo "Install with frozen deep: TRIM_WITH_DEEP=1 curl -fsSL https://use-trim.com/install.sh | sh"
          echo "Fallback UX: trim compress --bootstrap / TRIM_OPTIMIZER_BIN"
          echo "--- existing trim-deep assets on ${GITHUB_REF_NAME} (if any) ---"
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null | grep -E '^trim-deep-' || echo "(none yet)"
