name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test server
        run: go test ./...
      - name: Build API
        run: go build -o /tmp/trim-api ./cmd/api

  server-treesitter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Fetch Tree-sitter deps and build tagged API
        run: |
          go get github.com/smacker/go-tree-sitter@v0.0.0-20240827094217-dd81d9e9be82
          go mod tidy
          CGO_ENABLED=1 go build -tags treesitter -o /tmp/trim-api-ts ./cmd/api

  server-treesitter-zig:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Fetch Tree-sitter + Zig grammar and build
        run: |
          go get github.com/smacker/go-tree-sitter@v0.0.0-20240827094217-dd81d9e9be82
          go get github.com/tree-sitter-grammars/tree-sitter-zig@latest
          go mod tidy
          CGO_ENABLED=1 go build -tags "treesitter,zigts" -o /tmp/trim-api-zig ./cmd/api

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test CLI
        run: go test ./...
      - name: Build CLI
        run: go build -o /tmp/trim ./cmd/trim

  cli-treesitter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Fetch Tree-sitter deps and build tagged CLI
        run: |
          (cd ../server && go get github.com/smacker/go-tree-sitter@v0.0.0-20240827094217-dd81d9e9be82 && go mod tidy)
          go mod tidy
          CGO_ENABLED=1 go build -tags treesitter -o /tmp/trim-ts ./cmd/trim

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      # Next 16 defaults production builds to Turbopack, which OOMs intermittently
      # on ubuntu-latest (2 vCPU / ~7GB). Webpack keeps CI web deterministic.
      - name: Build
        run: npx next build --webpack
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
          NEXT_PUBLIC_ALLOWED_AUTH_PROVIDERS: google,github,gitlab
          NEXT_PUBLIC_PADDLE_ENV: sandbox
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_token

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Open-source CLI (MIT). No GITLEAKS_LICENSE - required for org-scale OSS.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  ide-nls-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Fail if package.nls drifts from site_messages builtins
        run: node scripts/check-ide-nls-sync.mjs

  trim-ide:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/trim-ide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/trim-ide/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
