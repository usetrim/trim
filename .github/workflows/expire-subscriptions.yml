# Idle subscription expire batch.
# Calls POST /internal/expire-subscriptions with X-Cron-Secret.
# Set repo secrets: TRIM_API_BASE_URL (e.g. https://api.use-trim.com), CRON_SECRET.
name: Expire subscriptions

on:
  schedule:
    # Every hour (UTC). Idle accounts past current_period_end fall back to free.
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Run expire batch
        env:
          TRIM_API_BASE_URL: ${{ secrets.TRIM_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TRIM_API_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing TRIM_API_BASE_URL or CRON_SECRET secrets; skip."
            exit 0
          fi
          BASE="${TRIM_API_BASE_URL%/}"
          code=$(curl -sS -o /tmp/expire-body.json -w "%{http_code}" \
            -X POST "${BASE}/internal/expire-subscriptions" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${code}"
          cat /tmp/expire-body.json || true
          case "$code" in
            200|204) exit 0 ;;
            *) exit 1 ;;
          esac
