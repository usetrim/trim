name: Bug report
description: Report a defect in Trim
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Trim. Include reproduction steps when possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trim CLI / API version
      placeholder: 0.1.0
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI proxy
        - API / auth / quotas
        - Billing / Paddle
        - Web dashboard
        - Docs / install
    validations:
      required: true
